[project]
name = "mcp-playwright-weather-israel"
version = "0.1.0"
description = "MCP Server that scrapes Israeli weather forecasts with Playwright, driven by an LLM host (Gemini)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9.0",
    "playwright>=1.48.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "e2e: opens a real browser and hits the live site (slow)",
]
